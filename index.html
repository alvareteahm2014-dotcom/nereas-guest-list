<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0d0d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Guest List">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-tap-highlight-color:transparent}
body{margin:0}
[hidden]{display:none!important}
</style>
<title>Nerea’s Guest List</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Syne:wght@700&display=swap">
<style>
/* Layout concept: herramienta nocturna de bolsillo. Oscuro por defecto (se usa de noche, en la puerta),
   pestañas abajo al alcance del pulgar, una columna central de 720px en pantallas grandes. */
:root{
  --bg:#0d0d0d;--surface:#1a1a19;--raise:#242422;
  --ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;
  --grid:#2c2c2a;--axis:#383835;--border:rgba(255,255,255,.10);
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--pink:#d55181;
  --btn:#2a78d6;--btn-ink:#ffffff;
  --good:#0ca30c;--good-text:#0ca30c;--crit:#d03b3b;
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --brand:"Syne",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#f9f9f7;--surface:#fcfcfb;--raise:#f1f0ec;
    --ink:#0b0b0b;--ink2:#52514e;--muted:#6f6d67;
    --grid:#e1e0d9;--axis:#c3c2b7;--border:rgba(11,11,11,.10);
    --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--pink:#e87ba4;--good-text:#006300;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#f9f9f7;--surface:#fcfcfb;--raise:#f1f0ec;
  --ink:#0b0b0b;--ink2:#52514e;--muted:#6f6d67;
  --grid:#e1e0d9;--axis:#c3c2b7;--border:rgba(11,11,11,.10);
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--pink:#e87ba4;--good-text:#006300;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:0 96px;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--s1);outline-offset:2px}
.wrap{max-width:720px;margin-inline:auto}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px}
.brand{font-family:var(--brand);font-weight:700;font-size:20px;letter-spacing:.01em;min-width:0}
.brand small{display:block;font-family:var(--font);font-weight:500;font-size:12px;letter-spacing:0;color:var(--muted);margin-top:1px}
.icon-btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--border);background:var(--surface);font-weight:600;font-size:14px}
.icon-btn svg{width:18px;height:18px;flex:none}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--border);padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px))}
.tabs-in{max-width:720px;margin-inline:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tab{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border:0;border-radius:12px;background:transparent;color:var(--ink2);font-weight:600}
.tab svg{width:20px;height:20px}
.tab[aria-selected="true"]{background:var(--raise);color:var(--ink);box-shadow:inset 0 -2px 0 var(--s1)}

/* generic */
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;min-width:0}
.card h2{margin:0 0 4px;font-size:15px;font-weight:700}
.sub{color:var(--ink2);font-size:13px}
.muted{color:var(--muted)}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.btn{min-height:46px;padding:0 18px;border:0;border-radius:12px;background:var(--btn);color:var(--btn-ink);font-weight:700}
.btn.ghost{background:var(--raise);color:var(--ink);border:1px solid var(--border)}
.btn.danger{background:var(--crit);color:#fff}
.btn.small{min-height:40px;padding:0 14px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--raise);border:1px dashed var(--axis);border-radius:12px;padding:10px 14px;font-size:13px;color:var(--ink2)}
.banner.warn{border-style:solid;border-color:var(--s2)}

/* forms */
label.f{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:var(--ink2);min-width:0}
.in{width:100%;min-height:46px;padding:0 12px;border-radius:12px;border:1px solid var(--axis);background:var(--raise);font-size:16px}
div.f[role="group"]{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:var(--ink2);min-width:0}
textarea.in{padding-block:10px;min-height:64px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.grid2.stackable{grid-template-columns:1fr}}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--raise);border:1px solid var(--axis);border-radius:12px;padding:4px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{display:flex;align-items:center;justify-content:center;gap:6px;min-height:38px;border-radius:9px;font-weight:600;font-size:14px;color:var(--ink2);cursor:pointer}
.seg input:checked+label{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--border)}
.seg input:focus-visible+label{outline:2px solid var(--s1)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--s1)}
.dot.mesa{background:var(--s3)}.dot.pago{background:var(--s2)}
.step{display:flex;align-items:center;border:1px solid var(--axis);border-radius:12px;background:var(--raise);min-height:46px;overflow:hidden}
.step button{width:46px;align-self:stretch;border:0;background:transparent;font-size:20px;font-weight:700}
.step output{flex:1;text-align:center;font-weight:700;font-size:16px}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:15;background:var(--surface);border:1px solid var(--axis);border-radius:12px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.sugg button{display:flex;justify-content:space-between;gap:10px;width:100%;min-height:44px;align-items:center;padding:0 12px;border:0;background:transparent;text-align:left}
.sugg button:hover,.sugg button:focus-visible{background:var(--raise)}
.rel{position:relative}
details.more summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--ink2);min-height:36px;display:flex;align-items:center}

/* chips and filters */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--axis);background:var(--surface);color:var(--ink2);font-weight:600;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--raise);color:var(--ink);border-color:var(--s1);box-shadow:inset 0 0 0 1px var(--s1)}
.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:520px){.filters{grid-template-columns:1fr 1fr}.filters .wide{grid-column:1/-1}}
.tag{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;background:var(--raise);border:1px solid var(--border);font-size:12px;font-weight:600;color:var(--ink)}
.plus{display:inline-flex;align-items:center;justify-content:center;min-height:22px;padding:0 9px;border-radius:999px;background:var(--btn);color:#fff;font-size:12px;font-weight:700;white-space:nowrap}
.plus.f{background:var(--pink);color:#0b0b0b}
.desc{font-size:12px;color:var(--ink2);margin-top:3px;overflow-wrap:anywhere}
.desc a{color:var(--ink);text-decoration:underline;text-underline-offset:2px}
.cells{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cell{border:1px solid var(--axis);border-radius:12px;background:var(--raise);padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.cell.m{box-shadow:inset 0 3px 0 var(--btn)}
.cell.f{box-shadow:inset 0 3px 0 var(--pink)}
.cell .ch{font-size:12px;font-weight:700;color:var(--ink2)}
.cell .step{background:var(--surface)}
.crew{display:flex;flex-direction:column;gap:8px}
.cname{display:grid;grid-template-columns:12px 1fr;gap:10px;align-items:center}
.cname .dot{width:12px;height:12px}
.cname.m .dot{background:var(--btn)}
.cname.f .dot{background:var(--pink)}
.cname .in{min-height:42px;background:var(--surface)}

/* dashboard */
.hero{display:flex;flex-direction:column;gap:6px}
.hero .big{font-size:52px;font-weight:700;line-height:1.05;letter-spacing:-.02em}
.hero .lbl{font-size:13px;color:var(--ink2);font-weight:600}
.hero .line{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:6px;font-size:13px;color:var(--ink2)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px;min-width:0}
.tile .v{font-size:24px;font-weight:700;line-height:1.1}
.tile .l{font-size:12px;color:var(--ink2);font-weight:600;margin-top:4px}
.tile .d{font-size:12px;color:var(--muted);margin-top:2px}
.bars{display:flex;flex-direction:column;gap:14px;margin-top:12px}
.bar-row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:baseline;cursor:default}
.bar-name{font-size:14px;font-weight:600;min-width:0;overflow-wrap:anywhere}
.bar-val{font-size:14px;font-weight:700}
.bar-track{grid-column:1/-1;border-left:1px solid var(--axis);height:14px}
.bar{height:14px;border-radius:0 4px 4px 0;background:var(--s1);min-width:2px}
.bar.pago{background:var(--s2)}
.chart-box{margin-top:8px;width:100%;overflow:hidden}
.debt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--grid)}
.debt:first-of-type{border-top:0}
.debt .who{min-width:0;font-weight:600;overflow-wrap:anywhere}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;border:1px solid var(--border);background:var(--raise)}
.badge svg{width:13px;height:13px}
.empty{padding:28px 8px;text-align:center;color:var(--ink2);font-size:14px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* lists tab */
.daynav{display:flex;align-items:center;gap:8px}
.daynav button{width:46px;height:46px;border-radius:12px;border:1px solid var(--border);background:var(--surface);font-size:18px;font-weight:700}
.daynav .date{flex:1;min-width:0;text-align:center;font-weight:700;font-size:16px}
.daynav .date::first-letter{text-transform:uppercase}
.daynav .date small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.group h3{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 4px;font-size:15px}
.group h3 span.k{font-size:12px;font-weight:600;color:var(--ink2)}
.list{list-style:none;margin:0;padding:0}
.person{display:grid;grid-template-columns:40px 1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--grid)}
.person:first-child{border-top:0}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--raise);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--ink2)}
.nm{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:700;overflow-wrap:anywhere;min-width:0}
.meta{display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:3px}
.enter{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--axis);background:var(--surface);font-weight:700;font-size:13px;white-space:nowrap}
.enter svg{width:16px;height:16px}
.enter[aria-pressed="true"]{background:var(--raise);border-color:var(--good)}
.enter[aria-pressed="true"] svg{color:var(--good-text)}
.dots{width:40px;height:44px;border:0;background:transparent;border-radius:12px;color:var(--ink2);font-size:20px;font-weight:700;line-height:1}
.edit{grid-column:1/-1;background:var(--raise);border:1px solid var(--border);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.edit .actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between}
@media (max-width:380px){.person{grid-template-columns:36px 1fr auto}.dots{grid-column:3;grid-row:2;justify-self:end}.avatar{width:36px;height:36px}}

.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:420px}
.tbl th,.tbl td{padding:8px 6px;text-align:right;border-top:1px solid var(--grid)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl thead th{border-top:0;color:var(--ink2);font-weight:600;font-size:12px}
.tbl tbody th{font-weight:700}

/* sheet, toast, tooltip */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:720px;max-height:88%;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin:0;font-size:18px}
.club-edit{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 0;border-top:1px solid var(--grid)}
.club-edit .name{grid-column:1/-1}
.club-edit .rm{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.toast{position:fixed;left:16px;right:16px;bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:60;max-width:420px;margin-inline:auto;background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 14px;font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.toast button{border:0;background:transparent;color:inherit;font-weight:700;text-decoration:underline;min-height:32px}
.tip{position:fixed;z-index:70;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:10px;padding:8px 10px;font-size:12px;line-height:1.4;max-width:240px;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.tip b{display:block;font-size:13px}
svg text{font-family:var(--font)}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">Nerea’s Guest List<small id="sub"></small></div>
    <button class="icon-btn" id="btnClubs" type="button" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
      Ajustes
    </button>
  </header>

  <div id="banners" class="stack" style="margin-bottom:14px"></div>

  <main>
    <!-- PESTAÑA 1: DASHBOARD -->
    <section id="view-dash" class="stack" role="tabpanel" aria-labelledby="tab-dash">
      <div class="card stack" style="gap:12px">
        <div class="chips" id="periodChips" role="group" aria-label="Periodo">
          <button class="chip" type="button" data-p="hoy" aria-pressed="false">Esta noche</button>
          <button class="chip" type="button" data-p="7d" aria-pressed="true">7 días</button>
          <button class="chip" type="button" data-p="mes" aria-pressed="false">Este mes</button>
          <button class="chip" type="button" data-p="todo" aria-pressed="false">Todo</button>
          <button class="chip" type="button" data-p="rango" aria-pressed="false">Rango</button>
        </div>
        <div class="grid2" id="rangeRow" hidden>
          <label class="f" for="d-from">Desde<input class="in" type="date" id="d-from"></label>
          <label class="f" for="d-to">Hasta<input class="in" type="date" id="d-to"></label>
        </div>
        <div class="filters">
          <label class="f" for="d-club">Discoteca<select class="in" id="d-club"></select></label>
          <label class="f" for="d-type">Tipo
            <select class="in" id="d-type">
              <option value="all">Todos</option><option value="lista">Lista</option><option value="mesa">Mesa</option><option value="pago">PAGO</option>
            </select>
          </label>
          <label class="f wide" for="d-status">Estado
            <select class="in" id="d-status">
              <option value="all">Todos</option><option value="in">Han entrado</option><option value="out">Pendientes de entrar</option>
            </select>
          </label>
        </div>
      </div>
      <div id="dashOut" class="stack"></div>
    </section>

    <!-- PESTAÑA 2: LISTAS -->
    <section id="view-lists" class="stack" role="tabpanel" aria-labelledby="tab-lists" hidden>
      <div class="daynav">
        <button type="button" id="dayPrev" aria-label="Noche anterior">‹</button>
        <div class="date" id="dayLabel"></div>
        <button type="button" id="dayNext" aria-label="Noche siguiente">›</button>
      </div>
      <div class="chips" id="clubChips" role="group" aria-label="Discoteca"></div>

      <form class="card stack" id="addForm" autocomplete="off" style="gap:14px">
        <h2>Añadir guest</h2>
        <label class="f rel" for="f-name">Nombre
          <input class="in" id="f-name" type="text" placeholder="Nombre y apellido" autocapitalize="words" required>
          <div class="sugg" id="sugg" hidden></div>
        </label>
        <div class="grid2 stackable">
          <label class="f" for="f-club">Discoteca<select class="in" id="f-club"></select></label>
          <div class="f" role="group" aria-label="Tipo">Tipo
            <div class="seg">
              <input type="radio" name="f-type" id="t-lista" value="lista" checked><label for="t-lista"><span class="dot"></span>Lista</label>
              <input type="radio" name="f-type" id="t-mesa" value="mesa"><label for="t-mesa"><span class="dot mesa"></span>Mesa</label>
              <input type="radio" name="f-type" id="t-pago" value="pago"><label for="t-pago"><span class="dot pago"></span>PAGO</label>
            </div>
          </div>
        </div>

        <div class="f" role="group" aria-label="Acompañantes">Acompañantes
          <div class="cells">
            <div class="cell m">
              <span class="ch">Chicos</span>
              <div class="step"><button type="button" data-step="m" data-d="-1" aria-label="Quitar un chico">−</button><output id="f-m" class="num">0</output><button type="button" data-step="m" data-d="1" aria-label="Añadir un chico">+</button></div>
            </div>
            <div class="cell f">
              <span class="ch">Chicas</span>
              <div class="step"><button type="button" data-step="f" data-d="-1" aria-label="Quitar una chica">−</button><output id="f-f" class="num">0</output><button type="button" data-step="f" data-d="1" aria-label="Añadir una chica">+</button></div>
            </div>
          </div>
        </div>
        <details class="more" id="crewDetails">
          <summary>Poner nombre a los acompañantes</summary>
          <div class="crew" id="f-crew" style="margin-top:8px"></div>
        </details>

        <label class="f" for="f-desc">Descripción del guest
          <textarea class="in" id="f-desc" placeholder="Instagram (@usuario), cómo va vestido, con quién suele venir…"></textarea>
        </label>

        <div class="stack" id="f-pago" hidden style="gap:12px">
          <div class="banner warn">PAGO: cuenta en el balance de la discoteca y sale de tu balance como pago al promotor que lo envía.</div>
          <div class="grid2 stackable">
            <label class="f" for="f-promoter">Promotor que lo envía
              <input class="in" id="f-promoter" list="promoters" type="text" placeholder="Nombre del promotor">
              <datalist id="promoters"></datalist>
            </label>
            <label class="f" for="f-payout">A pagarle (€)
              <input class="in num" id="f-payout" type="number" inputmode="decimal" min="0" step="0.5" placeholder="Igual que paga la sala">
            </label>
          </div>
        </div>

        <details class="more">

<script>
(function(){
'use strict';
var KEY='nereas-guest-list.v1';
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var uid=function(){return Math.random().toString(36).slice(2,9)};
var ESC={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return ESC[c]})};
var norm=function(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim()};
function pad(n){return String(n).padStart(2,'0')}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parse(s){var p=String(s).split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return iso(d)}
function nightDate(){var d=new Date();if(d.getHours()<7)d.setDate(d.getDate()-1);return iso(d)}
function fmtLong(s){return parse(s).toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'})}
function fmtShort(s){var p=s.split('-');return p[2]+'/'+p[1]}

/* ---------- estado y guardado ---------- */
var S=null, storageOk=true;
function fix(o){
  if(!o||!Array.isArray(o.clubs)||!Array.isArray(o.entries))return null;
  o.profiles=o.profiles||{};
  o.entries.forEach(function(e){if(!Array.isArray(e.comp))e.comp=[]});
  return o;
}
function load(){try{var r=localStorage.getItem(KEY);return r?fix(JSON.parse(r)):null}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));storageOk=true}catch(e){storageOk=false}}
function snap(){return JSON.stringify(S)}
function restoreSnap(s){S=fix(JSON.parse(s));save();renderAll()}

/* ---------- cálculos ---------- */
function club(id){return S.clubs.filter(function(c){return c.id===id})[0]}
function cnt(e,g){return (e.comp||[]).filter(function(c){return c.g===g}).length}
function heads(e){return 1+(e.comp?e.comp.length:0)}
function rate(c,t){return c?(+(t==='mesa'?c.rateMesa:c.rateLista)||0):0}
function hasNum(v){return v!=null&&v!==''&&!isNaN(+v)}
function amt(e){return hasNum(e.amount)?+e.amount:rate(club(e.clubId),e.type)*heads(e)}
function pay(e){return e.type==='pago'?(hasNum(e.payout)?+e.payout:amt(e)):0}
function eur(n){return new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',minimumFractionDigits:0,maximumFractionDigits:2}).format(n||0)}
function pkey(n){return norm(n)}
function profileOf(name){return S.profiles[pkey(name)]}
function visits(name){var k=pkey(name);return S.entries.filter(function(e){return pkey(e.name)===k}).length}
function initials(n){var p=String(n).trim().split(/\s+/);return ((p[0]||'?')[0]+(p.length>1?p[p.length-1][0]:'')).toUpperCase()}
function typeLabel(t){return t==='pago'?'PAGO':t==='mesa'?'Mesa':'Lista'}
function promoters(){var m={};S.entries.forEach(function(e){if(e.type==='pago'&&e.promoter)m[e.promoter]=1});return Object.keys(m).sort()}

function linkify(t){
  var h=esc(t);
  h=h.replace(/(https?:\/\/[^\s<]+)/g,function(u){return '<a href="'+u+'" target="_blank" rel="noopener noreferrer">'+u.replace(/^https?:\/\/(www\.)?/,'')+'</a>'});
  h=h.replace(/(^|[\s(·])@([A-Za-z0-9._]{2,30})/g,function(m,p,u){return p+'<a href="https://instagram.com/'+u+'" target="_blank" rel="noopener noreferrer">@'+u+'</a>'});
  return h;
}
function mkComp(m,f,names){
  var out=[],i;names=names||{};
  for(i=0;i<m;i++)out.push({g:'m',name:(names.m&&names.m[i])||''});
  for(i=0;i<f;i++)out.push({g:'f',name:(names.f&&names.f[i])||''});
  return out;
}
function upsertProfile(name,patch){
  var k=pkey(name);if(!k)return;
  var p=S.profiles[k]||{name:name.trim()};
  for(var x in patch)p[x]=patch[x];
  p.name=p.name||name.trim();
  S.profiles[k]=p;
}

/* ---------- datos de ejemplo (marcados, se borran con un toque) ---------- */

    [-1,'c2','Dani Cano','mesa',['Víctor','Nico'],['Sara','Ona'],true,'',false,'Siempre pide mesa'],
    [-1,'c2','Elena Ruiz','pago',[],['Noa','Alba'],true,'Jorge (RRPP)',false,'@elenaruiz'],
    [-2,'c1','Carlos Pérez','lista',['Dani'],[],true,'',false,''],
    [-2,'c1','Marta Vidal','lista',['Leo'],['Cris'],true,'',false,''],
    [-3,'c2','Irene Soto','lista',[],['Clara'],true,'',false,''],
    [-3,'c2','Pablo Medina','pago',['Hugo'],[],true,'Álex',true,''],
    [-4,'c1','Sofía León','mesa',['Gonzalo'],['Inés','Mía'],true,'',false,''],

  ];
  var d={v:1,clubs:clubs,entries:[],profiles:{}};
  S=d;
  R.forEach(function(r,i){
    var e={id:'d'+i,date:addDays(n,r[0]),clubId:r[1],name:r[2],type:r[3],comp:mkComp(r[4].length,r[5].length,{m:r[4],f:r[5]}),
      entered:r[6],amount:null,promoter:r[7],payout:null,paid:r[8],demo:true,ts:i};
    d.entries.push(e);
    if(!profileOf(r[2]))upsertProfile(r[2],{clubId:r[1],type:r[3],m:r[4].length,f:r[5].length,desc:r[9],demo:true});
    else if(r[9]&&!profileOf(r[2]).desc)upsertProfile(r[2],{desc:r[9]});

function hasDemo(){return S.clubs.some(function(c){return c.demo})||S.entries.some(function(e){return e.demo})}
function clearDemo(){
  var before=snap();
  S.entries=S.entries.filter(function(e){return !e.demo});
  // una discoteca de ejemplo que ya tiene guests reales se conserva como propia
  S.clubs=S.clubs.filter(function(c){return !c.demo||S.entries.some(function(e){return e.clubId===c.id})});
  S.clubs.forEach(function(c){delete c.demo});
  Object.keys(S.profiles).forEach(function(k){
    var p=S.profiles[k];
    if(p.demo&&!S.entries.some(function(e){return pkey(e.name)===k}))delete S.profiles[k];
    else delete p.demo;
  });
  save();renderAll();
  toast('Ejemplos borrados. Añade tu primera discoteca en Ajustes.',function(){restoreSnap(before)});
}

/* ---------- aviso flotante ---------- */
var toastT;
function toast(msg,undo){
  var r=$('#toastRoot');
  r.innerHTML='<div class="toast" role="status"><span>'+esc(msg)+'</span>'+(undo?'<button type="button" id="toastUndo">Deshacer</button>':'')+'</div>';
  if(undo)$('#toastUndo').onclick=function(){undo();r.innerHTML=''};
  clearTimeout(toastT);
  toastT=setTimeout(function(){r.innerHTML=''},undo?9000:2600);
}

/* ---------- estado de vistas ---------- */
var LV={date:nightDate(),club:'all',editing:null,confirmDel:null};
var DV={period:'7d',club:'all',type:'all',status:'all',from:'',to:''};
var FORM={m:0,f:0,names:{}};   // acompañantes del formulario; names: {'m0':'', 'f1':''}

/* =========================== DASHBOARD =========================== */
function dRange(){
  var t=nightDate();
  if(DV.period==='hoy')return [t,t];
  if(DV.period==='7d')return [addDays(t,-6),t];
  if(DV.period==='mes'){var d=parse(t);return [iso(new Date(d.getFullYear(),d.getMonth(),1)),t]}
  if(DV.period==='rango')return [DV.from||'0000-00-00',DV.to||'9999-99-99'];
  return ['0000-00-00','9999-99-99'];
}
function dFiltered(){
  var r=dRange();
  return S.entries.filter(function(e){
    if(e.date<r[0]||e.date>r[1])return false;
    if(DV.club!=='all'&&e.clubId!==DV.club)return false;
    if(DV.type!=='all'&&e.type!==DV.type)return false;
    if(DV.status==='in'&&!e.entered)return false;
    if(DV.status==='out'&&e.entered)return false;
    return true;
  });
}
function totals(list){
  var t={heads:0,inHeads:0,gen:0,ret:0,retPend:0,prevGen:0,prevRet:0,clubs:{},prom:{},days:{},n:list.length};
  list.forEach(function(e){
    var h=heads(e),a=amt(e),p=pay(e);
    t.heads+=h;
    var c=t.clubs[e.clubId]||(t.clubs[e.clubId]={gen:0,ret:0,heads:0,inH:0});
    c.heads+=h;
    t.days[e.date]=t.days[e.date]||0;
    if(e.entered){
      t.inHeads+=h;t.gen+=a;t.ret+=p;c.gen+=a;c.ret+=p;c.inH+=h;t.days[e.date]+=h;
      if(e.type==='pago'){
        var k=e.promoter||'Sin indicar';
        var pr=t.prom[k]||(t.prom[k]={total:0,pend:0,n:0,ids:[]});
        pr.total+=p;pr.n++;
        if(!e.paid){pr.pend+=p;pr.ids.push(e.id);t.retPend+=p}
      }
    }else{t.prevGen+=a;t.prevRet+=p}
  });
  return t;
}
var ICON_CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

function renderDashFilters(){
  var sel=$('#d-club');
  sel.innerHTML='<option value="all">Todas</option>'+S.clubs.map(function(c){return '<option value="'+esc(c.id)+'">'+esc(c.name)+'</option>'}).join('');
  if(DV.club!=='all'&&!club(DV.club))DV.club='all';
  sel.value=DV.club;$('#d-type').value=DV.type;$('#d-status').value=DV.status;
  $$('#periodChips .chip').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.p===DV.period))});
  $('#rangeRow').hidden=DV.period!=='rango';
  $('#d-from').value=DV.from;$('#d-to').value=DV.to;
}

function renderDash(){
  var list=dFiltered(),t=totals(list),out=$('#dashOut');
  if(!S.clubs.length){
    out.innerHTML='<div class="card empty"><b>Aún no hay discotecas</b>Añade la primera en Ajustes para empezar a apuntar guests.</div>';return;
  }
  if(!list.length){
    out.innerHTML='<div class="card empty"><b>Nada que mostrar</b>No hay guests con estos filtros. Prueba otro periodo o apunta gente en la pestaña Listas.</div>';return;
  }
  var neto=t.gen-t.ret,prevNeto=t.prevGen-t.prevRet,rate100=t.heads?Math.round(t.inHeads/t.heads*100):0;
  var h='';
  h+='<div class="card hero"><span class="lbl">Balance neto</span><span class="big num">'+esc(eur(neto))+'</span>'
   +'<div class="line"><span>Generado <b class="num">'+esc(eur(t.gen))+'</b></span>'
   +(t.ret>0?'<span>Retiros PAGO <b class="num">−'+esc(eur(t.ret))+'</b></span>':'')
   +(prevNeto>0?'<span>+<b class="num">'+esc(eur(prevNeto))+'</b> si entran los pendientes</span>':'')+'</div></div>';
  h+='<div class="tiles">'
   +'<div class="tile"><div class="v num">'+t.heads+'</div><div class="l">Apuntados</div><div class="d">'+t.n+(t.n===1?' guest':' guests')+' con acompañantes</div></div>'
   +'<div class="tile"><div class="v num">'+t.inHeads+'</div><div class="l">Han entrado</div><div class="d">'+(t.heads-t.inHeads)+' pendientes</div></div>'
   +'<div class="tile"><div class="v num">'+rate100+'%</div><div class="l">Entrada</div><div class="d">de lo apuntado</div></div></div>';

  // balance por discoteca
  var rows=S.clubs.filter(function(c){return t.clubs[c.id]}).map(function(c){return {c:c,d:t.clubs[c.id]}});
  rows.sort(function(a,b){return b.d.gen-a.d.gen});
  var max=Math.max.apply(null,rows.map(function(r){return r.d.gen}).concat([1]));
  h+='<div class="card"><h2>Balance por discoteca</h2><div class="sub">Lo que genera cada sala y qué parte sale hacia otros promotores.</div>';
  if(t.ret>0)h+='<div class="row-between" style="justify-content:flex-start;gap:16px;margin-top:10px;font-size:12px;color:var(--ink2)"><span style="display:inline-flex;gap:6px;align-items:center"><i class="dot"></i>Neto para ti</span><span style="display:inline-flex;gap:6px;align-items:center"><i class="dot pago"></i>Retiro PAGO</span></div>';
  h+='<div class="bars">';
  rows.forEach(function(r){
    var net=r.d.gen-r.d.ret,w=r.d.gen/max*100;
    var tipTxt=[r.c.name,'Dentro: '+r.d.inH+' de '+r.d.heads,'Generado: '+eur(r.d.gen),'Retiros PAGO: −'+eur(r.d.ret),'Neto: '+eur(net)].join('|');
    var seg='';
    if(r.d.gen>0){
      var wn=Math.max(0,net)/r.d.gen*100,wr=100-wn;
      seg='<div style="display:flex;gap:2px;width:'+w.toFixed(1)+'%">'
        +(wn>0?'<div class="bar" style="flex:'+wn.toFixed(2)+';'+(wr>0?'border-radius:0':'')+'"></div>':'')
        +(wr>0?'<div class="bar pago" style="flex:'+wr.toFixed(2)+'"></div>':'')+'</div>';
    }else seg='<div class="bar" style="width:2px;opacity:.4"></div>';
    h+='<div class="bar-row" data-tip="'+esc(tipTxt)+'" tabindex="0"><div class="bar-name">'+esc(r.c.name)+'</div><div class="bar-val num">'+esc(eur(r.d.gen))+'</div>'
      +'<div class="bar-track">'+seg+'</div>'
      +'<div class="sub" style="grid-column:1/-1">'+r.d.inH+' dentro de '+r.d.heads+(r.d.ret>0?' · retiros −'+esc(eur(r.d.ret))+' · neto '+esc(eur(net)):'')+'</div></div>';
  });
  h+='</div>';
  h+='<details class="more" style="margin-top:12px"><summary>Ver como tabla</summary><div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Discoteca</th><th>Dentro</th><th>Generado</th><th>Retiros</th><th>Neto</th></tr></thead><tbody>'
    +rows.map(function(r){return '<tr><td>'+esc(r.c.name)+'</td><td class="num">'+r.d.inH+'/'+r.d.heads+'</td><td class="num">'+esc(eur(r.d.gen))+'</td><td class="num">'+esc(eur(r.d.ret))+'</td><td class="num">'+esc(eur(r.d.gen-r.d.ret))+'</td></tr>'}).join('')
    +'<tr><th>Total</th><th class="num">'+t.inHeads+'/'+t.heads+'</th><th class="num">'+esc(eur(t.gen))+'</th><th class="num">'+esc(eur(t.ret))+'</th><th class="num">'+esc(eur(neto))+'</th></tr></tbody></table></div></details></div>';

  // por noche
  var days=Object.keys(t.days).sort().slice(-14);
  if(days.length>1){
    h+='<div class="card"><h2>Personas dentro por noche</h2><div class="sub">Guests más acompañantes que han entrado.</div><div class="chart-box" id="colChart"></div></div>';
  }

  // deudas con promotores
  var pk=Object.keys(t.prom);
  if(pk.length){
    h+='<div class="card"><h2>PAGO · lo que debes a otros promotores</h2><div class="sub">Pendiente de pagar: <b class="num">'+esc(eur(t.retPend))+'</b></div><div style="margin-top:8px">';
    pk.sort(function(a,b){return t.prom[b].pend-t.prom[a].pend}).forEach(function(k){
      var p=t.prom[k];
      h+='<div class="debt"><div class="who">'+esc(k)+'<div class="sub">'+p.n+(p.n===1?' guest':' guests')+' · total '+esc(eur(p.total))+'</div></div>'
       +(p.pend>0?'<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end"><span class="num" style="font-weight:700">'+esc(eur(p.pend))+'</span><button class="btn small ghost" type="button" data-act="paid" data-prom="'+esc(k)+'">Marcar pagado</button></div>'
         :'<span class="badge">'+ICON_CHECK+'Pagado</span>')+'</div>';
    });
    h+='</div></div>';
  }
  out.innerHTML=h;
  if(days.length>1)drawColumns($('#colChart'),days,t.days);
}

function niceMax(m){return Math.max(4,Math.ceil(m/4)*4)}
function drawColumns(el,days,data){
  var W=Math.max(260,el.clientWidth||320),H=190,L=30,B=24,T=22,R=6;
  var vals=days.map(function(d){return data[d]}),mx=niceMax(Math.max.apply(null,vals));
  var pw=W-L-R,ph=H-T-B,step=pw/days.length,bw=Math.min(24,step*.6),s='';
  [0,mx/2,mx].forEach(function(v){
    var y=T+ph-v/mx*ph;
    s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" style="stroke:var(--'+(v===0?'axis':'grid')+')" stroke-width="1"/>'
     +'<text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end" font-size="11" style="fill:var(--muted)">'+v+'</text>';
  });
  var maxI=vals.indexOf(Math.max.apply(null,vals));
  days.forEach(function(d,i){
    var v=vals[i],h=v/mx*ph,x=L+step*i+(step-bw)/2,y=T+ph-h,r=Math.min(4,h);
    if(h>0)s+='<path d="M'+x+','+(y+h)+' L'+x+','+(y+r)+' Q'+x+','+y+' '+(x+r)+','+y+' L'+(x+bw-r)+','+y+' Q'+(x+bw)+','+y+' '+(x+bw)+','+(y+r)+' L'+(x+bw)+','+(y+h)+' Z" style="fill:var(--s1)"/>';
    if(i===maxI&&v>0)s+='<text x="'+(x+bw/2)+'" y="'+(y-6)+'" text-anchor="middle" font-size="12" font-weight="700" style="fill:var(--ink)">'+v+'</text>';
    if(days.length<=8||i%2===(days.length-1)%2)s+='<text x="'+(x+bw/2)+'" y="'+(H-7)+'" text-anchor="middle" font-size="11" style="fill:var(--muted)">'+fmtShort(d)+'</text>';
    s+='<rect x="'+(L+step*i)+'" y="'+T+'" width="'+step+'" height="'+ph+'" fill="transparent" data-tip="'+esc(fmtLong(d)+'|'+v+(v===1?' persona dentro':' personas dentro'))+'"/>';
  });
  el.innerHTML='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Personas dentro por noche">'+s+'</svg>';
}

function markPaid(prom){
  var before=snap(),list=dFiltered(),n=0;
  list.forEach(function(e){
    if(e.type==='pago'&&e.entered&&!e.paid&&(e.promoter||'Sin indicar')===prom){e.paid=true;n++}
  });
  if(!n)return;
  save();renderDash();
  toast('Pagos a '+prom+' marcados como pagados.',function(){restoreSnap(before)});
}

function bindDash(){
  $('#periodChips').addEventListener('click',function(ev){
    var b=ev.target.closest('.chip');if(!b)return;
    DV.period=b.dataset.p;
    if(DV.period==='rango'&&!DV.from){DV.to=nightDate();DV.from=addDays(DV.to,-6)}
    renderDashFilters();renderDash();
  });
  $('#d-club').onchange=function(){DV.club=this.value;renderDash()};

/* tooltip por delegación: ratón, táctil y teclado */
var tipEl=$('#tip');
function showTip(src,x,y){
  var parts=String(src.getAttribute('data-tip')).split('|');
  tipEl.innerHTML='<b>'+esc(parts[0])+'</b>'+parts.slice(1).map(esc).join('<br>');
  tipEl.hidden=false;
  var w=tipEl.offsetWidth,hh=tipEl.offsetHeight;
  var Lx=Math.min(Math.max(8,x-w/2),window.innerWidth-w-8),Ty=y-hh-14;
  if(Ty<8)Ty=y+18;
  tipEl.style.left=Lx+'px';tipEl.style.top=Ty+'px';
}
function hideTip(){tipEl.hidden=true}
document.addEventListener('pointermove',function(ev){var s=ev.target.closest&&ev.target.closest('[data-tip]');if(s)showTip(s,ev.clientX,ev.clientY);else hideTip()});
document.addEventListener('pointerdown',function(ev){var s=ev.target.closest&&ev.target.closest('[data-tip]');if(s)showTip(s,ev.clientX,ev.clientY);else hideTip()});
document.addEventListener('focusin',function(ev){var s=ev.target.closest&&ev.target.closest('[data-tip]');if(s){var r=s.getBoundingClientRect();showTip(s,r.left+r.width/2,r.top)}});
document.addEventListener('focusout',hideTip);
window.addEventListener('scroll',hideTip,{passive:true});

var EDIT=null;
function plusChips(e){
  var m=cnt(e,'m'),f=cnt(e,'f'),s='';

function syncEdit(){
  if(!EDIT||!$('#e-name'))return;
  EDIT.name=$('#e-name').value;EDIT.clubId=$('#e-club').value;
  var t=$('input[name="e-type"]:checked');if(t)EDIT.type=t.value;
  EDIT.desc=$('#e-desc').value;EDIT.amount=$('#e-amount').value;
  if($('#e-promoter')){EDIT.promoter=$('#e-promoter').value;EDIT.payout=$('#e-payout').value;EDIT.paid=$('#e-paid').checked}
}
function sortComp(c){return c.filter(function(x){return x.g==='m'}).concat(c.filter(function(x){return x.g==='f'}))}
function openEdit(id){
  var e=S.entries.filter(function(x){return x.id===id})[0];if(!e)return;
  var p=profileOf(e.name);
  EDIT={id:id,name:e.name,clubId:e.clubId,type:e.type,comp:sortComp(e.comp.map(function(c){return {g:c.g,name:c.name}})),
    desc:p&&p.desc?p.desc:'',amount:hasNum(e.amount)?e.amount:'',promoter:e.promoter||'',payout:hasNum(e.payout)?e.payout:'',paid:!!e.paid};
  LV.confirmDel=null;renderLists();
}
function saveEdit(){
  syncEdit();
  var E=EDIT,e=S.entries.filter(function(x){return x.id===E.id})[0];if(!e)return;
  var name=E.name.trim();if(!name){toast('El nombre no puede quedar vacío.');return}
  e.name=name;e.clubId=E.clubId;e.type=E.type;e.comp=E.comp.map(function(c){return {g:c.g,name:c.name.trim()}});
  e.amount=hasNum(E.amount)?+E.amount:null;
  e.promoter=E.type==='pago'?E.promoter.trim():'';e.payout=E.type==='pago'&&hasNum(E.payout)?+E.payout:null;e.paid=E.type==='pago'?!!E.paid:false;
  upsertProfile(name,{clubId:e.clubId,type:e.type,comp:e.comp.map(function(c){return {g:c.g,name:c.name}}),desc:E.desc.trim()});
  delete e.demo;
  EDIT=null;LV.confirmDel=null;save();renderAll();toast('Guardado');
}
function delEntry(){
  var before=snap(),id=EDIT.id,nm=EDIT.name;
  S.entries=S.entries.filter(function(x){return x.id!==id});
  EDIT=null;LV.confirmDel=null;save();renderAll();
  toast(nm+' eliminado/a de la lista.',function(){restoreSnap(before)});
}

function renderLists(){
  $('#dayLabel').innerHTML=esc(fmtLong(LV.date))+'<small>'+(LV.date===nightDate()?'Esta noche':LV.date<nightDate()?'Noche pasada':'Próxima noche')+'</small>';
  var dayList=S.entries.filter(function(e){return e.date===LV.date});
  var chips='<button class="chip" type="button" data-c="all" aria-pressed="'+(LV.club==='all')+'">Todas · '+dayList.length+'</button>';
  S.clubs.forEach(function(c){
    var n=dayList.filter(function(e){return e.clubId===c.id}).length;
    chips+='<button class="chip" type="button" data-c="'+esc(c.id)+'" aria-pressed="'+(LV.club===c.id)+'">'+esc(c.name)+' · '+n+'</button>';
  });
  $('#clubChips').innerHTML=chips;
  var out=$('#listOut');
  if(!S.clubs.length){out.innerHTML='<div class="card empty"><b>Aún no hay discotecas</b>Añade la primera en Ajustes para empezar a apuntar guests.</div>';return}
  var h='',any=false;
  S.clubs.forEach(function(c){
    if(LV.club!=='all'&&LV.club!==c.id)return;
    var es=dayList.filter(function(e){return e.clubId===c.id});
    if(!es.length)return;
    any=true;
    es.sort(function(a,b){return a.name.localeCompare(b.name,'es')});
    var inH=0,tot=0,gen=0;
    es.forEach(function(e){tot+=heads(e);if(e.entered){inH+=heads(e);gen+=amt(e)}});
    h+='<section class="card group"><h3><span>'+esc(c.name)+'</span><span class="k num">'+inH+' de '+tot+' dentro · '+esc(eur(gen))+'</span></h3><ul class="list">'+es.map(personRow).join('')+'</ul></section>';
  });
  out.innerHTML=any?h:'<div class="card empty"><b>Lista vacía</b>Nadie apuntado para esta noche'+(LV.club!=='all'?' en esta discoteca':'')+'. Añade al primer guest arriba.</div>';
}

/* ---------- formulario de alta ---------- */
function renderForm(){
  var sel=$('#f-club'),cur=sel.value;
  sel.innerHTML=S.clubs.map(function(c){return '<option value="'+esc(c.id)+'">'+esc(c.name)+'</option>'}).join('');
  var want=club(cur)?cur:(LV.club!=='all'&&club(LV.club)?LV.club:(S.clubs[0]?S.clubs[0].id:''));
  sel.value=want;
  $('#promoters').innerHTML=promoters().map(function(p){return '<option value="'+esc(p)+'">'}).join('');
  $('#btnAdd').disabled=!S.clubs.length;
  renderCrew();
}
function renderCrew(){
  var h='';
  ['m','f'].forEach(function(g){
    for(var i=0;i<FORM[g];i++){
      var k=g+i,lbl='Nombre de '+(g==='m'?'chico ':'chica ')+(i+1);
      h+='<div class="cname '+g+'"><i class="dot"></i><input class="in" type="text" data-fk="'+k+'" value="'+esc(FORM.names[k]||'')+'" placeholder="'+lbl+'" aria-label="'+lbl+'"></div>';
    }
  });
  $('#f-crew').innerHTML=h;
  $('#f-m').textContent=FORM.m;$('#f-f').textContent=FORM.f;
  var det=$('#crewDetails'),n=FORM.m+FORM.f;
  det.hidden=!n;
  det.querySelector('summary').textContent='Poner nombre a los acompañantes ('+n+')';
}
function formComp(){
  var c=[];
  ['m','f'].forEach(function(g){for(var i=0;i<FORM[g];i++)c.push({g:g,name:(FORM.names[g+i]||'').trim()})});
  return c;
}
function numOrNull(sel){var v=$(sel).value;return v!==''&&!isNaN(+v)?+v:null}
function togglePago(){$('#f-pago').hidden=!$('#t-pago').checked}
function resetForm(){
  FORM={m:0,f:0,names:{}};
  ['#f-name','#f-desc','#f-amount','#f-payout','#f-promoter'].forEach(function(s){$(s).value=''});
  $('#sugg').hidden=true;renderCrew();
}

function showSugg(){
  var q=norm($('#f-name').value),box=$('#sugg');
  if(!q){box.hidden=true;return}
  var hits=Object.keys(S.profiles).map(function(k){return S.profiles[k]})
    .filter(function(p){return norm(p.name).indexOf(q)>-1})
    .sort(function(a,b){return visits(b.name)-visits(a.name)}).slice(0,5);
  if(!hits.length){box.hidden=true;return}
  box.innerHTML=hits.map(function(p){
    var c=club(p.clubId);
    return '<button type="button" data-pk="'+esc(pkey(p.name))+'"><span>'+esc(p.name)+'</span><span class="sub">'+esc(c?c.name:'')+' · '+visits(p.name)+'x</span></button>';
  }).join('');
  box.hidden=false;
}
function pickProfile(k){
  var p=S.profiles[k];if(!p)return;
  $('#f-name').value=p.name;
  if(p.clubId&&club(p.clubId))$('#f-club').value=p.clubId;
  var t=document.getElementById('t-'+(p.type||'lista'));if(t){t.checked=true;togglePago()}
  var comp=p.comp&&p.comp.length?p.comp:mkComp(p.m||0,p.f||0);
  FORM={m:0,f:0,names:{}};
  comp.forEach(function(c){var g=c.g==='f'?'f':'m';FORM.names[g+FORM[g]]=c.name||'';FORM[g]++});
  $('#f-desc').value=p.desc||'';
  if(p.promoter)$('#f-promoter').value=p.promoter;
  $('#sugg').hidden=true;renderCrew();
}

function submitForm(ev){
  ev.preventDefault();
  var name=$('#f-name').value.trim();if(!name)return;
  var clubId=$('#f-club').value;
  if(!clubId||!club(clubId)){toast('Primero añade una discoteca en Ajustes.');return}
  var dup=S.entries.some(function(e){return e.date===LV.date&&e.clubId===clubId&&pkey(e.name)===pkey(name)});
  if(dup){toast(name+' ya está apuntado/a esta noche en '+club(clubId).name+'.');return}
  var type=($('input[name="f-type"]:checked')||{}).value||'lista';
  var comp=formComp(),promoter=type==='pago'?$('#f-promoter').value.trim():'';
  S.entries.push({id:uid(),date:LV.date,clubId:clubId,name:name,type:type,comp:comp,entered:false,
    amount:numOrNull('#f-amount'),promoter:promoter,payout:type==='pago'?numOrNull('#f-payout'):null,paid:false,ts:Date.now()});
  var patch={clubId:clubId,type:type,comp:comp.map(function(c){return {g:c.g,name:c.name}}),promoter:promoter};
  var d=$('#f-desc').value.trim();if(d)patch.desc=d;
  upsertProfile(name,patch);
  if(LV.club!=='all'&&LV.club!==clubId)LV.club='all';
  save();resetForm();renderLists();renderDash();
  $('#f-name').focus();
  toast('Añadido: '+name);
}

/* ---------- eventos de la pestaña Listas ---------- */
function entryOf(el){var li=el.closest('li.person');return li?S.entries.filter(function(x){return x.id===li.dataset.id})[0]:null}
function bindLists(){
  $('#dayPrev').onclick=function(){LV.date=addDays(LV.date,-1);EDIT=null;renderLists()};
  $('#dayNext').onclick=function(){LV.date=addDays(LV.date,1);EDIT=null;renderLists()};
  $('#clubChips').addEventListener('click',function(ev){
    var b=ev.target.closest('.chip');if(!b)return;
    LV.club=b.dataset.c;EDIT=null;
    if(LV.club!=='all')$('#f-club').value=LV.club;
    renderLists();
  });
  var nm=$('#f-name');
  nm.addEventListener('input',showSugg);
  nm.addEventListener('focus',showSugg);
  nm.addEventListener('blur',function(){setTimeout(function(){$('#sugg').hidden=true},180)});
  $('#sugg').addEventListener('mousedown',function(ev){ev.preventDefault()});
  $('#sugg').addEventListener('click',function(ev){var b=ev.target.closest('[data-pk]');if(b)pickProfile(b.dataset.pk)});
  $$('input[name="f-type"]').forEach(function(r){r.addEventListener('change',togglePago)});
  $('#addForm').addEventListener('click',function(ev){
    var b=ev.target.closest('[data-step]');if(!b)return;
    var g=b.dataset.step,d=+b.dataset.d,n=FORM[g]+d;
    if(n<0||n>15)return;
    if(d<0)delete FORM.names[g+n];
    FORM[g]=n;renderCrew();
  });
  $('#addForm').addEventListener('input',function(ev){
    var k=ev.target.dataset&&ev.target.dataset.fk;if(k)FORM.names[k]=ev.target.value;
  });
  $('#addForm').addEventListener('submit',submitForm);

  var out=$('#listOut');
  out.addEventListener('click',function(ev){
    var b=ev.target.closest('[data-act]');if(!b)return;
    var act=b.dataset.act,e;
    if(act==='toggle'){e=entryOf(b);if(!e)return;e.entered=!e.entered;save();renderLists();renderDash();return}
    if(act==='edit'){e=entryOf(b);if(!e)return;if(EDIT&&EDIT.id===e.id){EDIT=null;LV.confirmDel=null;renderLists()}else openEdit(e.id);return}
    if(!EDIT)return;
    if(act==='estep'){
      syncEdit();
      var g=b.dataset.g,d=+b.dataset.d,have=EDIT.comp.filter(function(c){return c.g===g}).length;
      if(d>0){if(have>=15)return;EDIT.comp.push({g:g,name:''})}
      else{for(var i=EDIT.comp.length-1;i>=0;i--){if(EDIT.comp[i].g===g){EDIT.comp.splice(i,1);break}}}
      EDIT.comp=sortComp(EDIT.comp);renderLists();return;
    }
    if(act==='save'){saveEdit();return}
    if(act==='cancel'){EDIT=null;LV.confirmDel=null;renderLists();return}
    if(act==='del'){syncEdit();LV.confirmDel=EDIT.id;renderLists();return}
    if(act==='del2'){delEntry();return}
  });
  out.addEventListener('input',function(ev){
    var i=ev.target.dataset&&ev.target.dataset.ci;
    if(i!=null&&EDIT&&EDIT.comp[+i])EDIT.comp[+i].name=ev.target.value;
  });
  out.addEventListener('change',function(ev){
    if(ev.target.name==='e-type'&&EDIT){syncEdit();renderLists()}
  });
}

    +'<p class="sub" style="margin:4px 0 0">Los datos se guardan en este navegador. Descarga una copia de vez en cuando por si cambias de móvil o borras los datos del navegador.</p>'
    +'<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">'
    +'<button class="btn" type="button" data-sa="backup">Guardar copia</button>'
    +'<label class="btn ghost" for="restoreFile" style="display:inline-flex;align-items:center;cursor:pointer">Restaurar copia</label>'
    +'<input id="restoreFile" type="file" accept=".json,application/json" style="position:absolute;opacity:0;width:1px;height:1px">'
    +'</div>'
    +(hasDemo()?'<h2 style="margin:24px 0 0;font-size:15px">Datos de ejemplo</h2><button class="btn ghost" type="button" data-sa="cleardemo" style="margin-top:8px">Borrar ejemplos y empezar</button>':'')
    +'</div></div>';
  root.innerHTML=h;
}
function openSheet(){SH.open=true;SH.confirm=null;renderSheet();var b=$('#sheetClose');if(b)b.focus()}
function closeSheet(){SH.open=false;SH.confirm=null;renderSheet();renderAll();$('#btnClubs').focus()}

function backup(){
  var fname='nereas-guest-list-'+nightDate()+'.json',text=JSON.stringify(S,null,2);
  if(DL){
    DL.save({filename:fname,data:text})
      .then(function(){toast('Copia guardada')})
      .catch(function(e){if(e&&e.code==='declined')return;toast('No se pudo guardar la copia.')});
    return;
  }
  // fuera del visor (app instalada): hoja de compartir del iPhone, o descarga normal
  try{
    var file=new File([text],fname,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      navigator.share({files:[file],title:'Copia de Nerea’s Guest List'})
        .then(function(){toast('Copia guardada')})
        .catch(function(e){if(e&&e.name==='AbortError')return;toast('No se pudo guardar la copia.')});
      return;
    }
  }catch(e){}
  try{
    var url=URL.createObjectURL(new Blob([text],{type:'application/json'})),a=document.createElement('a');
    a.href=url;a.download=fname;document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(url)},4000);toast('Copia descargada');
  }catch(e){toast('No se pudo guardar la copia.')}
}
function restoreFile(file){
  if(!file)return;
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var o=fix(JSON.parse(rd.result));if(!o)throw new Error('formato');
      var before=snap();S=o;save();EDIT=null;SH.open=false;renderSheet();renderAll();
      toast('Copia restaurada: '+o.entries.length+' guests y '+o.clubs.length+' discotecas.',function(){restoreSnap(before)});
    }catch(e){toast('Ese archivo no es una copia válida.')}
  };
  rd.onerror=function(){toast('No se pudo leer el archivo.')};
  rd.readAsText(file);
}

function bindShell(){
  $('#btnClubs').onclick=openSheet;
  $('#sheetRoot').addEventListener('click',function(ev){
    if(ev.target.id==='scrim'){closeSheet();return}
    var b=ev.target.closest('[data-sa]');if(!b)return;
    var a=b.dataset.sa,id=b.dataset.cid;
    if(a==='close')closeSheet();
    else if(a==='cadd'){
      var nc={id:uid(),name:'Nueva discoteca',rateLista:0,rateMesa:0};S.clubs.push(nc);save();renderSheet();
      var inp=document.getElementById('cn-'+nc.id);if(inp){inp.focus();inp.select()}
    }
    else if(a==='cdel'){SH.confirm=id;renderSheet()}
    else if(a==='cdel2'){
      var used=S.entries.filter(function(e){return e.clubId===id}).length;
      if(used){SH.confirm=null;renderSheet();toast('Esa discoteca tiene '+used+' guests apuntados. Elimínalos primero.');return}
      var before=snap();S.clubs=S.clubs.filter(function(c){return c.id!==id});SH.confirm=null;save();renderSheet();
      toast('Discoteca eliminada.',function(){restoreSnap(before);renderSheet()});
    }
    else if(a==='backup')backup();
    else if(a==='cleardemo'){SH.open=false;renderSheet();clearDemo()}
  });
  $('#sheetRoot').addEventListener('change',function(ev){
    var t=ev.target;
    if(t.id==='restoreFile'){restoreFile(t.files&&t.files[0]);t.value='';return}
    var f=t.dataset&&t.dataset.cf;if(!f)return;
    var c=club(t.dataset.cid);if(!c)return;
    if(f==='name'){c.name=t.value.trim()||'Sin nombre';t.value=c.name}
    else{var v=parseFloat(t.value);c[f]=isNaN(v)||v<0?0:v;t.value=c[f]}
    delete c.demo;save();
  });
  document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&SH.open)closeSheet()});

  $('#banners').addEventListener('click',function(ev){
    var b=ev.target.closest('[data-ba]');if(!b)return;
    if(b.dataset.ba==='cleardemo')clearDemo();
    if(b.dataset.ba==='settings')openSheet();
  });
  $$('.tab').forEach(function(b){b.addEventListener('click',function(){setTab(b.dataset.tab);window.scrollTo(0,0)})});
}

function renderBanners(){
  var h='';
  if(hasDemo())h+='<div class="banner"><span>Estás viendo datos de ejemplo.</span><button class="btn small ghost" type="button" data-ba="cleardemo">Borrar ejemplos y empezar</button></div>';
  if(!storageOk)h+='<div class="banner warn"><span>Este navegador no deja guardar datos. Descarga una copia desde Ajustes antes de cerrar.</span><button class="btn small ghost" type="button" data-ba="settings">Abrir Ajustes</button></div>';
  $('#banners').innerHTML=h;
  $('#banners').style.display=h?'':'none';
}

var TAB='dash';
function setTab(name){
  TAB=name==='lists'?'lists':'dash';
  $('#view-dash').hidden=TAB!=='dash';
  $('#view-lists').hidden=TAB!=='lists';
  $$('.tab').forEach(function(b){b.setAttribute('aria-selected',String(b.dataset.tab===TAB))});
  try{localStorage.setItem('nereas-guest-list.tab',TAB)}catch(e){}
  if(TAB==='dash')renderDash();else renderLists();
}
function renderAll(){
  renderBanners();
  $('#sub').textContent=fmtLong(nightDate());
  renderDashFilters();renderForm();
  if(TAB==='dash')renderDash();else renderLists();
}

/* ---------- arranque ---------- */
try{localStorage.setItem('nereas-guest-list.probe','1');localStorage.removeItem('nereas-guest-list.probe')}catch(e){storageOk=false}
S=load()||demoData();
save();
bindDash();bindLists();bindShell();
try{TAB=localStorage.getItem('nereas-guest-list.tab')==='lists'?'lists':'dash'}catch(e){}
renderAll();
setTab(TAB);
try{
  if(window.claude&&window.claude.use){
    window.claude.use('downloads').then(function(d){DL=d||null}).catch(function(){DL=null});
  }
}catch(e){DL=null}

try{
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
    window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
  }
}catch(e){}
})();
</script>
