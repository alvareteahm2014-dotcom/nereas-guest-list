<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0d0d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Guest List">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-tap-highlight-color:transparent}
body{margin:0}
[hidden]{display:none!important}
</style>
<title>Nerea’s Guest List</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Syne:wght@700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">Nerea’s Guest List<small id="sub"></small></div>
    <button class="icon-btn" id="btnClubs" type="button" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
      Ajustes
    </button>
  </header>

  <div id="banners" class="stack" style="margin-bottom:14px"></div>

  <main>
    <!-- PESTAÑA 1: DASHBOARD -->
    <section id="view-dash" class="stack" role="tabpanel" aria-labelledby="tab-dash">
      <div class="card" id="monthsCard"></div>
      <div class="card stack" style="gap:12px">
        <div class="chips" id="periodChips" role="group" aria-label="Periodo">
          <button class="chip" type="button" data-p="hoy" aria-pressed="false">Esta noche</button>
          <button class="chip" type="button" data-p="7d" aria-pressed="true">7 días</button>
          <button class="chip" type="button" data-p="mes" aria-pressed="false">Este mes</button>
          <button class="chip" type="button" data-p="todo" aria-pressed="false">Todo</button>
          <button class="chip" type="button" data-p="rango" aria-pressed="false">Rango</button>
        </div>
        <div class="grid2" id="rangeRow" hidden>
          <label class="f" for="d-from">Desde<input class="in" type="date" id="d-from"></label>
          <label class="f" for="d-to">Hasta<input class="in" type="date" id="d-to"></label>
        </div>
        <div class="filters">
          <label class="f" for="d-club">Discoteca<select class="in" id="d-club"></select></label>
          <label class="f" for="d-type">Tipo
            <select class="in" id="d-type">
              <option value="all">Todos</option><option value="lista">Lista</option><option value="mesa">⭐ Mesa</option><option value="pago">PAGO</option>
            </select>
          </label>
          <label class="f wide" for="d-status">Estado
            <select class="in" id="d-status">
              <option value="all">Todos</option><option value="in">Han entrado</option><option value="out">Pendientes de entrar</option>
            </select>
          </label>
        </div>
      </div>
      <div id="dashOut" class="stack"></div>
    </section>

    <!-- PESTAÑA 2: LISTAS -->
    <section id="view-lists" class="stack" role="tabpanel" aria-labelledby="tab-lists" hidden>
      <div class="daynav">
        <button type="button" id="dayPrev" aria-label="Noche anterior">‹</button>
        <div class="date" id="dayLabel"></div>
        <button type="button" id="dayNext" aria-label="Noche siguiente">›</button>
      </div>
      <div class="chips" id="clubChips" role="group" aria-label="Discoteca"></div>
      <div class="sumbar" id="sumBar"></div>

      <form class="card addcard" id="addForm" autocomplete="off">
        <div class="seg" role="group" aria-label="Tipo">
          <input type="radio" name="f-type" id="t-lista" value="lista" checked><label for="t-lista"><span class="dot"></span>Lista</label>
          <input type="radio" name="f-type" id="t-mesa" value="mesa"><label for="t-mesa">⭐ Mesa</label>
          <input type="radio" name="f-type" id="t-pago" value="pago"><label for="t-pago"><span class="dot pago"></span>PAGO</label>
        </div>
        <div class="addline">
          <div class="rel">
            <input class="in" id="f-name" type="text" placeholder="Nombre  6+3" autocapitalize="words" aria-label="Nombre y personas, por ejemplo Quique 6+3">
            <div class="sugg" id="sugg" hidden></div>
          </div>
          <button class="btn" type="submit" id="btnAdd">Añadir</button>
        </div>
        <div class="hint" id="hint">Nombre y número de personas. <b>6+3</b> = 6 chicos + 3 chicas.</div>
        <div id="f-pago" hidden>
          <input class="in" id="f-promoter" list="promoters" type="text" placeholder="Promotor que lo envía" aria-label="Promotor que lo envía">
          <datalist id="promoters"></datalist>
        </div>
      </form>

      <div id="listOut" class="stack"></div>
    </section>
  </main>
</div>

<nav class="tabs" role="tablist" aria-label="Secciones">
  <div class="tabs-in">
    <button class="tab" role="tab" id="tab-dash" data-tab="dash" aria-selected="true" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Dashboard
    </button>
    <button class="tab" role="tab" id="tab-lists" data-tab="lists" aria-selected="false" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>Listas
    </button>
  </div>
</nav>

<div id="sheetRoot"></div>
<div id="toastRoot"></div>
<div class="tip" id="tip" hidden></div>
<script src="app.js"></script>
</body>
</html>
